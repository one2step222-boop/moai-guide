<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>언제 싸지나 — 스팀 게임, 지금 사도 되나</title>
<meta name="description" content="스팀 할인 예측·역대 최저가">
<meta http-equiv="refresh" content="0; url=https://steam.overtake.ai.kr/">
<link rel="canonical" href="https://steam.overtake.ai.kr/">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08080a;--fg:#f4f1ea;--mute:#8b8f99;--acc:#ff4a1c;--line:#22252c;--card:#101318}
body{background:var(--bg);color:var(--fg);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:28px 22px 96px}
header{display:flex;justify-content:space-between;align-items:baseline;
border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:40px}
header .s{font-weight:800;font-size:15px;letter-spacing:-.2px}
header .n{color:var(--acc);font-weight:800;font-size:15px}
h1{font-size:34px;line-height:1.28;font-weight:800;letter-spacing:-.6px;margin:6px 0 14px}
h1 em{font-style:normal;color:var(--acc)}
.lead{color:var(--mute);font-size:16px;margin-bottom:34px}
h2{font-size:22px;font-weight:800;margin:44px 0 12px;letter-spacing:-.3px}
h3{font-size:17px;font-weight:800;margin:26px 0 8px;color:#dfe3ea}
p{margin:12px 0;font-size:16px;color:#d7dbe2}
ul,ol{margin:12px 0 12px 20px}li{margin:7px 0;font-size:16px;color:#d7dbe2}
code{background:#161a20;border:1px solid var(--line);border-radius:6px;padding:2px 7px;
font-family:ui-monospace,Consolas,monospace;font-size:14px;color:#ffd9c9}
pre{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;
overflow-x:auto;margin:16px 0}
pre code{background:none;border:0;padding:0;color:#cfd6e2;font-size:13.5px;line-height:1.7}
.rule{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);
border-radius:12px;padding:16px 18px;margin:18px 0}
.rule b{color:#fff}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;color:#d7dbe2}
th{color:var(--mute);font-weight:700;font-size:13px}
.num{color:var(--acc);font-weight:800}
a{color:var(--acc);text-decoration:none;border-bottom:1px solid rgba(255,74,28,.4)}
footer{margin-top:70px;border-top:1px solid var(--line);padding-top:22px;color:var(--mute);font-size:14px}
footer b{color:var(--acc)}
.idx{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;
padding:18px 20px;margin:12px 0;border-bottom:1px solid var(--line)}
.idx .t{font-weight:800;font-size:18px;color:#fff}
.idx .d{color:var(--mute);font-size:14px;margin-top:4px}

.mid{max-width:520px;margin:0 auto;text-align:center;padding-top:90px}
.btn{display:inline-block;background:var(--acc);color:#fff;border-radius:14px;
padding:16px 26px;margin-top:22px;font-weight:800;font-size:17px;text-decoration:none}
</style>
<script>location.replace("https://steam.overtake.ai.kr/")</script>
</head><body><div class="wrap"><div class="mid">
<h1>언제 싸지나</h1>
<p class="lead">스팀 할인 예측·역대 최저가 — 잠시 뒤 이동합니다.</p>
<a class="btn" href="https://steam.overtake.ai.kr/">지금 열기</a>
<footer>steam.overtake.ai.kr · <b>@yena.steam</b></footer>
</div></div></body></html>
